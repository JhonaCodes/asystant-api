[package]
name = "asystant_api"
version = "0.4.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/JhonaCodes/asystant-api"
description = "Managed OpenRouter keys for client services: per-tenant budgets, daily provider keys, revocation and usage reconciliation"

[dependencies]
async-trait = "0.1"
actix-web = { version = "4", default-features = false, features = ["macros", "cookies"] }
anyhow = "1"
argon2 = "0.5"
base64 = "0.22.1"
bigdecimal = "0.4.9"
chacha20poly1305 = { version = "0.11.0", features = ["getrandom", "rand_core"] }
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.3", features = ["sqlite", "r2d2", "chrono", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3"
env_logger = "0.11.9"
futures-util = "0.3"
getrandom = "0.4"
hmac = "0.12"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
actix-rt = "2"

# argon2id with 64 MiB is slow unoptimized; keep sign-in tests fast in debug.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
